name: Build arm64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/openal-system-events-arm64

permissions:
  contents: read

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;35.0.0 ndk;25.2.9519653'
          log-accepted-android-studio-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 debug APK
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 --no-daemon --stacktrace

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher-arm64-debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
